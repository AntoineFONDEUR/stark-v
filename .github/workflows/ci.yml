name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-29

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release

  test:
    name: Test
    runs-on: ubuntu-latest
    # The full suite plus margin; a hung proving test must not burn the
    # default 6-hour budget.
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          targets: riscv32im-unknown-none-elf
          toolchain: nightly-2026-01-29

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143

      # The `ci` profile (.config/nextest.toml) excludes the heavy-proofs
      # recursion modules: each needs tens of GiB and hours of proving, beyond
      # any GitHub-hosted runner. They run locally under the guarded release
      # procedure recorded in docs/roadmap.md (REL-001).
      - name: Run tests (release, heavy proofs excluded)
        run: cargo nextest run --release --workspace --profile ci

      # nextest does not run doctests; the workspace has a handful of fast ones.
      - name: Run doctests (release)
        run: cargo test --release --doc --workspace
